<!doctype html>
<html lang="en" dir="ltr" data-page="404">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070708">
  <meta name="robots" content="noindex">
  <title>Page not found · QD Systems</title>
  <link rel="icon" href="/assets/qd-logo.jpeg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#070708;--fg:#f4f4f6;--muted:#a6a6ad;--dim:#8b8b93;--line:rgba(255,255,255,.1);--silver:linear-gradient(135deg,#fff 0%,#ececed 28%,#a9a9b0 58%,#f0f0f3 100%)}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.055),transparent 58%),var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
    a{color:inherit;text-decoration:none}
    .site-header{width:min(100% - 48px,1320px);min-height:82px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:inline-flex;align-items:center;gap:12px;min-width:0}
    .brand img{width:38px;height:38px;border-radius:9px;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
    .brand b{font-family:"Space Grotesk",Inter,sans-serif;font-size:14px;font-weight:600;letter-spacing:.22em;white-space:nowrap}
    .languages{display:flex;align-items:center;gap:6px}
    .languages button{min-width:42px;min-height:40px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--dim);font:600 12px Inter,system-ui,sans-serif;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
    .languages button:hover,.languages button:focus-visible{border-color:var(--line);background:rgba(255,255,255,.05);color:var(--fg);outline:none}
    .languages button:focus-visible,.home:focus-visible{outline:2px solid #fff;outline-offset:3px}
    main{width:min(100% - 40px,760px);margin:auto;display:grid;justify-items:center;text-align:center;padding:64px 0 90px}
    .mark{display:grid;place-items:center;width:112px;height:112px;margin-bottom:30px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.015));box-shadow:0 24px 70px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.08);font:600 35px/1 "Space Grotesk",Inter,sans-serif;letter-spacing:-.06em;color:#e5e5e9}
    .eyebrow{margin:0 0 14px;color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.22em}
    h1{max-width:680px;margin:0;font:600 clamp(2.25rem,6.5vw,4.4rem)/1.05 "Space Grotesk",Inter,sans-serif;letter-spacing:-.045em}
    .copy{max-width:500px;margin:20px 0 30px;color:var(--muted);font-size:clamp(15px,2vw,17px)}
    .home{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:13px 22px;border:1px solid transparent;border-radius:11px;background:var(--silver);color:#0a0a0b;box-shadow:0 10px 30px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.6);font-weight:600;font-size:14.5px;transition:transform .2s,box-shadow .25s}
    .home:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.7)}
    .home svg{width:16px;height:16px;flex:none}
    footer{padding:18px 20px 22px;text-align:center;color:var(--dim);font-size:12px}
    [dir=rtl] .brand b{letter-spacing:.1em}
    [dir=rtl] .home svg{transform:scaleX(-1)}
    @media(max-width:480px){.site-header{width:calc(100% - 32px);min-height:72px}.brand{gap:9px}.brand img{width:34px;height:34px}.brand b{font-size:12px;letter-spacing:.16em}.languages{gap:1px}.languages button{min-width:37px;min-height:42px;padding:0 7px}main{width:calc(100% - 36px);padding:44px 0 70px}.mark{width:88px;height:88px;margin-bottom:24px;border-radius:24px;font-size:29px}.copy{margin:17px 0 25px}.home{width:100%;max-width:300px;min-height:52px}}
    @media(max-width:360px){.site-header{width:calc(100% - 24px);gap:10px}.brand{gap:7px}.brand b{font-size:11px;letter-spacing:.11em}.languages{gap:0;flex-shrink:0}.languages button{min-width:31px;padding:0 4px;font-size:11px;white-space:nowrap}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="QD Systems homepage"><img src="/assets/qd-logo.jpeg" alt="" width="38" height="38"><b>QD&nbsp;SYSTEMS</b></a>
    <nav class="languages" aria-label="Language">
      <button type="button" lang="en" data-lang="en" aria-label="English">EN</button>
      <button type="button" lang="ar" data-lang="ar" aria-label="العربية">AR</button>
      <button type="button" lang="zh" data-lang="zh" aria-label="简体中文">中文</button>
      <button type="button" lang="ru" data-lang="ru" aria-label="Русский">RU</button>
    </nav>
  </header>
  <main>
    <div class="mark" aria-hidden="true">QD</div>
    <p class="eyebrow" data-i18n="404.eyebrow">ERROR 404</p>
    <h1 data-i18n="404.title">This page took a wrong turn.</h1>
    <p class="copy" data-i18n="404.copy">The address may be incorrect, or the page may have moved. Let’s get you back on track.</p>
    <a class="home" href="/" data-i18n-aria="404.homeAria" aria-label="Go to the QD Systems homepage"><span data-i18n="404.home">Back to homepage</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </main>
  <footer>© <span data-current-year></span> QD Systems</footer>
  <script src="/assets/current-year.js" defer></script>
  <script src="/i18n.js" defer></script>
  <script>
    document.querySelectorAll('[data-lang]').forEach(function(button){button.addEventListener('click',function(){if(window.qdSetLang)window.qdSetLang(button.getAttribute('data-lang'));});});
  </script>
</body>
</html>
