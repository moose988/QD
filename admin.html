<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Website Admin</title>
  <meta name="description" content="Restaurant Website Admin is a standalone demo back office for restaurant analytics, orders, menu management, and branch operations." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
  <style>
    :root{
      --primary:#2E5BD8;
      --primary-active:#244BBC;
      --primary-soft:#EAF0FD;
      --navy:#232C6B;
      --navy-ink:#22284F;
      --green:#4BA636;
      --green-soft:rgba(75,166,54,.12);
      --canvas:#FFFFFF;
      --surface-soft:#F3F7FD;
      --surface-strong:#EEF3FB;
      --hairline:#E2E9F4;
      --border-strong:#C6D3E6;
      --text:#22284F;
      --body:#3D456A;
      --muted:#5C6685;
      --muted-soft:#8A93B0;
      --danger:#C13515;
      --warning:#D48919;
      --on-primary:#FFFFFF;
      --scrim:rgba(0,0,0,.5);
      --shadow:rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;
      --r-xs:4px;
      --r-sm:8px;
      --r-md:14px;
      --r-lg:20px;
      --r-xl:32px;
      --r-full:9999px;
      --s-xxs:2px;
      --s-xs:4px;
      --s-sm:8px;
      --s-md:12px;
      --s-base:16px;
      --s-lg:24px;
      --s-xl:32px;
      --s-xxl:48px;
      --s-section:64px;
      --sidebar-w:280px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(46,91,216,.10), transparent 24%),
        radial-gradient(circle at 100% 0%, rgba(75,166,54,.09), transparent 18%),
        var(--surface-soft);
      color:var(--text);
      font:400 16px/1.5 "Plus Jakarta Sans", system-ui, sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    body.modal-open{overflow:hidden}
    a{color:inherit;text-decoration:none}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    img{display:block;max-width:100%}
    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }
    .skip-link{
      position:absolute;
      left:var(--s-base);
      top:-48px;
      z-index:1000;
      padding:var(--s-md) var(--s-base);
      border-radius:var(--r-full);
      background:var(--primary);
      color:var(--on-primary);
      transition:top .2s ease;
    }
    .skip-link:focus{top:var(--s-base)}
    :focus-visible{
      outline:2px solid var(--primary);
      outline-offset:3px;
    }

    .admin-shell{
      display:grid;
      grid-template-columns:var(--sidebar-w) minmax(0,1fr);
      min-height:100vh;
    }
    .sidebar{
      position:sticky;
      top:0;
      height:100vh;
      padding:var(--s-lg);
      background:
        radial-gradient(circle at top right, rgba(75,166,54,.14), transparent 30%),
        linear-gradient(180deg, var(--navy) 0%, #1c2459 100%);
      color:#fff;
      display:flex;
      flex-direction:column;
      gap:var(--s-lg);
    }
    .brand-block{
      display:flex;
      align-items:center;
      gap:var(--s-md);
      padding-bottom:var(--s-lg);
      border-bottom:1px solid rgba(255,255,255,.12);
    }
    .brand-mark{
      width:56px;
      height:56px;
      border-radius:var(--r-md);
      background:#fff;
      display:grid;
      place-items:center;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .brand-mark img{width:100%;height:100%;object-fit:cover}
    .brand-copy strong{
      display:block;
      font:700 20px/1.1 "Space Grotesk", system-ui, sans-serif;
      letter-spacing:-.02em;
    }
    .brand-copy span{
      display:block;
      margin-top:var(--s-xs);
      color:rgba(255,255,255,.72);
      font:600 11px/1.2 "Plus Jakarta Sans", system-ui, sans-serif;
      text-transform:uppercase;
      letter-spacing:.16em;
    }
    .sidebar-section-label{
      color:rgba(255,255,255,.58);
      font:700 12px/1.33 "Plus Jakarta Sans", system-ui, sans-serif;
      letter-spacing:.16em;
      text-transform:uppercase;
      margin-bottom:var(--s-sm);
    }
    .nav-list{
      list-style:none;
      padding:0;
      margin:0;
      display:grid;
      gap:var(--s-sm);
    }
    .nav-link{
      width:100%;
      border:none;
      text-align:left;
      display:flex;
      align-items:center;
      gap:var(--s-md);
      padding:14px 16px;
      border-radius:var(--r-full);
      background:transparent;
      color:rgba(255,255,255,.75);
      font:600 16px/1.25 "Plus Jakarta Sans", system-ui, sans-serif;
      transition:background .2s ease, color .2s ease, transform .2s ease;
    }
    .nav-link:hover,
    .nav-link[aria-current="page"]{
      background:rgba(255,255,255,.10);
      color:#fff;
      transform:translateX(2px);
    }
    .nav-link .icon{
      width:40px;
      height:40px;
      border-radius:var(--r-full);
      background:rgba(255,255,255,.08);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }
    .nav-link svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
    .sidebar-card{
      margin-top:auto;
      padding:var(--s-lg);
      border-radius:var(--r-lg);
      background:rgba(255,255,255,.08);
      box-shadow:var(--shadow);
    }
    .sidebar-card strong{
      display:block;
      font:700 20px/1.18 "Space Grotesk", system-ui, sans-serif;
      margin-bottom:var(--s-sm);
    }
    .sidebar-card p{
      margin:0 0 var(--s-lg);
      color:rgba(255,255,255,.74);
      font-size:14px;
      line-height:1.43;
    }

    .content{
      min-width:0;
      display:flex;
      flex-direction:column;
      padding:var(--s-lg);
      gap:var(--s-lg);
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      align-items:center;
      gap:var(--s-base);
      justify-content:space-between;
      padding:var(--s-base) var(--s-lg);
      border-radius:var(--r-xl);
      border:1px solid var(--hairline);
      background:rgba(255,255,255,.88);
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
    }
    .topbar-left{
      display:flex;
      align-items:center;
      gap:var(--s-base);
      min-width:0;
    }
    .menu-button{
      display:none;
      width:48px;
      height:48px;
      border-radius:var(--r-full);
      border:1px solid var(--hairline);
      background:#fff;
      color:var(--navy);
    }
    .topbar h1{
      margin:0;
      font:700 28px/1.43 "Space Grotesk", system-ui, sans-serif;
      color:var(--navy);
      letter-spacing:0;
    }
    .topbar p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.43;
    }
    .topbar-right{
      display:flex;
      align-items:center;
      gap:var(--s-md);
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .search-shell{
      display:flex;
      align-items:center;
      gap:var(--s-sm);
      min-width:min(360px, 100%);
      padding:14px 18px;
      border-radius:var(--r-full);
      border:1px solid var(--hairline);
      background:#fff;
      box-shadow:var(--shadow);
    }
    .search-shell input{
      width:100%;
      border:none;
      background:transparent;
      color:var(--text);
      font-size:14px;
      outline:none;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:var(--s-sm);
      padding:8px 14px;
      border-radius:var(--r-full);
      font:600 14px/1.29 "Plus Jakarta Sans", system-ui, sans-serif;
      border:1px solid var(--hairline);
      background:#fff;
      color:var(--muted);
    }
    .chip strong{
      color:var(--navy);
      font-weight:700;
    }
    .chip.success{
      background:var(--green-soft);
      color:#2d6922;
      border-color:rgba(75,166,54,.18);
    }
    .chip-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:currentColor;
    }
    .btn{
      min-height:48px;
      padding:12px 24px;
      border-radius:var(--r-sm);
      border:1px solid transparent;
      font:500 16px/1.25 "Plus Jakarta Sans", system-ui, sans-serif;
      transition:background .2s ease, color .2s ease, border-color .2s ease, transform .2s ease;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--primary);color:var(--on-primary)}
    .btn-primary:active{background:var(--primary-active)}
    .btn-secondary{background:#fff;color:var(--navy);border-color:var(--hairline)}
    .btn-secondary.success{color:var(--green);border-color:rgba(75,166,54,.25)}
    .btn-secondary.danger{color:var(--danger);border-color:rgba(193,53,21,.2)}
    .btn-text{background:transparent;color:var(--navy);padding-inline:0}
    .icon-btn{
      width:40px;
      height:40px;
      border-radius:var(--r-full);
      border:1px solid var(--hairline);
      background:#fff;
      color:var(--navy);
      display:grid;
      place-items:center;
      box-shadow:var(--shadow);
    }

    .page{
      display:grid;
      gap:var(--s-lg);
      align-content:start;
    }
    .hero-card,
    .surface,
    .stat-card,
    .dish,
    .table-wrap,
    .branch-card,
    .customer-panel,
    .promo-card{
      border:1px solid var(--hairline);
      border-radius:var(--r-md);
      background:var(--canvas);
      box-shadow:var(--shadow);
    }
    .hero-card{
      padding:var(--s-xl);
      display:grid;
      grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);
      gap:var(--s-xl);
      background:
        radial-gradient(circle at top right, rgba(46,91,216,.10), transparent 28%),
        linear-gradient(180deg, #fff 0%, #fbfcff 100%);
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font:700 12px/1.33 "Plus Jakarta Sans", system-ui, sans-serif;
      text-transform:uppercase;
      letter-spacing:.16em;
      color:var(--primary);
    }
    .eyebrow::before{
      content:"";
      width:22px;
      height:2px;
      border-radius:2px;
      background:var(--green);
    }
    .hero-card h2{
      margin:16px 0 14px;
      font:700 28px/1.43 "Space Grotesk", system-ui, sans-serif;
      color:var(--navy);
      max-width:16ch;
    }
    .hero-card p{
      margin:0;
      color:var(--muted);
      max-width:56ch;
    }
    .hero-actions{
      display:flex;
      gap:var(--s-md);
      flex-wrap:wrap;
      margin-top:var(--s-lg);
    }
    .hero-side{
      display:grid;
      gap:var(--s-md);
      align-content:start;
    }
    .mini-metric{
      padding:var(--s-lg);
      border-radius:var(--r-lg);
      background:var(--surface-soft);
      border:1px solid var(--hairline);
    }
    .mini-metric span{
      display:block;
      color:var(--muted);
      font:500 14px/1.29 "Plus Jakarta Sans", system-ui, sans-serif;
    }
    .mini-metric strong{
      display:block;
      margin-top:var(--s-sm);
      font:700 22px/1.18 "Space Grotesk", system-ui, sans-serif;
      color:var(--navy);
    }

    .stats-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:var(--s-base);
    }
    .stat-card{
      padding:var(--s-lg);
    }
    .stat-card span{
      display:block;
      color:var(--muted);
      font:500 14px/1.29 "Plus Jakarta Sans", system-ui, sans-serif;
      margin-bottom:var(--s-sm);
    }
    .stat-card strong{
      display:block;
      font:700 32px/1.1 "Space Grotesk", system-ui, sans-serif;
      color:var(--navy);
    }
    .stat-card small{
      display:block;
      margin-top:var(--s-sm);
      color:var(--green);
      font:600 13px/1.23 "Plus Jakarta Sans", system-ui, sans-serif;
    }

    .panel-grid{
      display:grid;
      grid-template-columns:1.3fr .95fr;
      gap:var(--s-lg);
    }
    .surface{
      padding:var(--s-lg);
      min-width:0;
    }
    .surface-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:var(--s-md);
      margin-bottom:var(--s-lg);
    }
    .surface-head h3{
      margin:0;
      font:600 21px/1.43 "Space Grotesk", system-ui, sans-serif;
      color:var(--navy);
    }
    .surface-head p{
      margin:6px 0 0;
      color:var(--muted);
      font-size:14px;
    }
    .surface-head-actions{
      display:flex;
      align-items:center;
      gap:var(--s-sm);
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .surface-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:var(--s-lg);
    }

    .table-wrap{
      overflow:auto;
    }
    table{
      width:100%;
      border-collapse:collapse;
      min-width:700px;
    }
    th,td{
      padding:14px 16px;
      border-bottom:1px solid var(--hairline);
      text-align:left;
      vertical-align:middle;
    }
    th{
      color:var(--muted);
      font:700 12px/1.33 "Plus Jakarta Sans", system-ui, sans-serif;
      text-transform:uppercase;
      letter-spacing:.16em;
      background:#fbfcff;
    }
    tbody tr:hover{background:var(--surface-soft)}
    tbody tr:last-child td{border-bottom:none}
    .row-button{
      border:none;
      background:transparent;
      color:inherit;
      width:100%;
      text-align:left;
      padding:0;
    }
    .status-badge,
    .halal-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:4px 10px;
      border-radius:var(--r-full);
      font:600 11px/1.18 "Plus Jakarta Sans", system-ui, sans-serif;
      text-transform:uppercase;
      letter-spacing:.06em;
      white-space:nowrap;
    }
    .status-badge.pending{background:#FFF5E5;color:#9A5B00}
    .status-badge.preparing{background:var(--primary-soft);color:var(--primary)}
    .status-badge.ready{background:var(--green-soft);color:#2d6922}
    .status-badge.delivered{background:rgba(35,44,107,.08);color:var(--navy)}
    .status-badge.cancelled{background:rgba(193,53,21,.10);color:var(--danger)}
    .halal-badge{background:var(--green-soft);color:#2d6922}

    .quick-actions{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:var(--s-md);
    }
    .quick-action{
      border:1px solid var(--hairline);
      border-radius:var(--r-md);
      background:var(--surface-soft);
      padding:var(--s-lg);
      display:grid;
      gap:var(--s-sm);
      align-content:start;
    }
    .quick-action strong{
      font:600 16px/1.25 "Space Grotesk", system-ui, sans-serif;
      color:var(--navy);
    }
    .quick-action p{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    .branch-stack,
    .promo-stack{
      display:grid;
      gap:var(--s-md);
    }
    .branch-card,
    .promo-card{
      padding:var(--s-lg);
    }
    .branch-card header,
    .promo-card header{
      display:flex;
      justify-content:space-between;
      gap:var(--s-md);
      align-items:flex-start;
      margin-bottom:var(--s-md);
    }
    .branch-card h4,
    .promo-card h4{
      margin:0;
      font:600 20px/1.2 "Space Grotesk", system-ui, sans-serif;
      color:var(--navy);
    }
    .branch-card p,
    .promo-card p{
      margin:6px 0 0;
      color:var(--muted);
      font-size:14px;
    }
    .promo-actions{
      display:flex;
      justify-content:flex-end;
      margin-top:var(--s-md);
    }

    .control-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:var(--s-md);
      flex-wrap:wrap;
    }
    .control-stack{
      display:grid;
      gap:var(--s-md);
    }
    .control-bar .search-shell{
      min-width:min(320px, 100%);
      margin-left:auto;
    }
    .filters{
      display:flex;
      gap:var(--s-sm);
      flex-wrap:wrap;
    }
    .pill-btn{
      min-height:40px;
      padding:8px 16px;
      border-radius:var(--r-full);
      border:1px solid var(--hairline);
      background:#fff;
      color:var(--muted);
      font:500 14px/1.29 "Plus Jakarta Sans", system-ui, sans-serif;
    }
    .pill-btn.active{
      border-color:var(--primary);
      background:var(--primary-soft);
      color:var(--navy);
    }
    .pagination-bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:var(--s-md);
      margin-top:16px;
      flex-wrap:wrap;
    }
    .pagination-copy{
      color:var(--muted);
      font:500 14px/1.4 "Plus Jakarta Sans", system-ui, sans-serif;
    }
    .field,
    .select,
    .textarea{
      width:100%;
      min-height:56px;
      padding:14px 12px;
      border-radius:var(--r-sm);
      border:1px solid var(--hairline);
      background:#fff;
      color:var(--text);
    }
    .textarea{
      min-height:120px;
      resize:vertical;
    }
    .field-row{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:var(--s-base);
    }
    .field-block{
      display:grid;
      gap:var(--s-sm);
    }
    .field-block label{
      color:var(--muted);
      font:500 14px/1.29 "Plus Jakarta Sans", system-ui, sans-serif;
    }

    .menu-grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:var(--s-base);
    }
    .dish{
      overflow:hidden;
      display:flex;
      flex-direction:column;
      transition:transform .3s ease, box-shadow .3s ease;
    }
    .dish:hover{
      transform:translateY(-4px);
      box-shadow:var(--shadow);
    }
    .dish-img{
      position:relative;
      aspect-ratio:4 / 5;
      overflow:hidden;
    }
    .dish-img img{
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .dish .halal{
      position:absolute;
      top:12px;
      left:12px;
      background:rgba(255,255,255,.94);
      color:var(--green);
      font:600 11px/1.18 "Plus Jakarta Sans", system-ui, sans-serif;
      text-transform:uppercase;
      letter-spacing:.06em;
      padding:4px 10px;
      border-radius:var(--r-full);
      box-shadow:var(--shadow);
    }
    .dish-body{
      display:flex;
      flex-direction:column;
      gap:var(--s-sm);
      padding:18px 20px 22px;
      flex:1;
    }
    .dish-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:var(--s-md);
    }
    .dish-top h4{
      margin:0;
      font:600 16px/1.25 "Space Grotesk", system-ui, sans-serif;
      color:var(--navy);
    }
    .dish-price{
      color:var(--primary);
      font:700 16px/1.25 "Space Grotesk", system-ui, sans-serif;
      white-space:nowrap;
    }
    .dish-body p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.43;
    }
    .branch-toggle-grid{
      display:grid;
      gap:var(--s-sm);
      margin-top:var(--s-md);
    }
    .branch-toggle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:var(--s-md);
      padding:12px 0;
      border-top:1px solid var(--hairline);
    }
    .switch{
      position:relative;
      width:48px;
      height:28px;
      border:none;
      border-radius:var(--r-full);
      background:var(--border-strong);
      transition:background .2s ease;
    }
    .switch::after{
      content:"";
      position:absolute;
      top:3px;
      left:3px;
      width:22px;
      height:22px;
      border-radius:50%;
      background:#fff;
      box-shadow:var(--shadow);
      transition:left .2s ease;
    }
    .switch[aria-checked="true"]{
      background:var(--green);
    }
    .switch[aria-checked="true"]::after{
      left:23px;
    }
    .card-actions{
      display:flex;
      gap:var(--s-sm);
      flex-wrap:wrap;
      margin-top:auto;
      padding-top:var(--s-sm);
    }

    .analytics-grid{

    function formatCurrency(value){
      return `AED ${value.toLocaleString("en-US")}`;
    }

    function escapeAttribute(value){
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeHtml(value){
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function initials(name){
      return name.split(" ").map((part) => part[0]).slice(0, 2).join("");
    }

    function getOrderById(orderId){
      return mockData.orders.find((order) => order.id === orderId);
    }

    function getCustomerById(customerId){
      return mockData.customers.find((customer) => customer.id === customerId);
    }

    function getBranchById(branchId){
      return mockData.branches.find((branch) => branch.id === branchId);
    }

    function getMenuItemByName(name){
      return mockData.menuItems.find((item) => item.name === name);
    }

    function getLiveOrders(){
      return mockData.orders.filter((order) => ["Pending", "Preparing", "Ready"].includes(order.status));
    }

    function getTodayRevenue(){
      return mockData.orders
        .filter((order) => order.serviceDate === "2026-06-02" && order.status !== "Cancelled")
        .reduce((sum, order) => sum + order.total, 0);
    }

    function getSevenDayRevenueSeries(){
      const days = ["2026-05-27", "2026-05-28", "2026-05-29", "2026-05-30", "2026-05-31", "2026-06-01", "2026-06-02"];
      return days.map((date) => {
        const dayOrders = mockData.orders.filter((order) => order.serviceDate === date && order.status !== "Cancelled");
        const label = new Date(`${date}T12:00:00`).toLocaleDateString("en-US", { weekday: "short" });
        return {
          date,
          day: label,
          amount: dayOrders.reduce((sum, order) => sum + order.total, 0),
          orders: dayOrders.length
        };
      });
    }

    function getTopDishCounts(){
      return mockData.menuItems
        .map((dish) => ({
          name: dish.name,
          count: mockData.orders.reduce((sum, order) => sum + order.items.filter((item) => item === dish.name).length, 0)
        }))
        .sort((a, b) => b.count - a.count)
        .slice(0, 5);
    }

    function getCategorySalesData(){
      const totals = {};
      mockData.orders
        .filter((order) => order.status !== "Cancelled")
        .forEach((order) => {
          order.items.forEach((itemName) => {
            const item = getMenuItemByName(itemName);
            if (!item) return;
            totals[item.category] = (totals[item.category] || 0) + item.price;
          });
        });
      return Object.entries(totals)
        .map(([category, total]) => ({ category, total }))
        .sort((a, b) => b.total - a.total);
    }

    function getAnalyticsSummary(){
      const revenue = mockData.analyticsSnapshots.revenue;
      const totalOrders = revenue.reduce((sum, day) => sum + day.orders, 0);
      const deliveryCount = revenue.reduce((sum, day) => sum + day.delivery, 0);
      const pickupCount = revenue.reduce((sum, day) => sum + day.pickup, 0);
      const promoOrderCount = Math.round(totalOrders * 0.24);
      const returningCount = Math.round(totalOrders * 0.58);
      return {
        deliveryShare: Math.round((deliveryCount / totalOrders) * 100),
        pickupShare: Math.round((pickupCount / totalOrders) * 100),
        promoShare: Math.round((promoOrderCount / totalOrders) * 100),
        returningShare: Math.round((returningCount / totalOrders) * 100)
      };
    }

    let focusTrapCleanup = null;

    function trapFocus(container){
      releaseFocusTrap();
      const focusable = container.querySelectorAll('a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])');
      const items = Array.from(focusable);
      if (!items.length) return;
      const first = items[0];
      const last = items[items.length - 1];
      const handler = (event) => {
        if (event.key === "Escape") {
          if (state.modalOpen) closeModal();
          if (state.orderDrawerOpen) closeOrderDrawer();
          return;
        }
        if (event.key !== "Tab") return;
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      };
      document.addEventListener("keydown", handler);
      focusTrapCleanup = () => document.removeEventListener("keydown", handler);
    }

    function releaseFocusTrap(){
      if (focusTrapCleanup) focusTrapCleanup();
      focusTrapCleanup = null;
    }

    function handleModalSubmit(event){
      event.preventDefault();
      const formData = new FormData(event.currentTarget);

      if (state.modalType === "menu") {
        const branchMap = Object.fromEntries(mockData.branches.map((branch) => [branch.id, formData.get(`branch-${branch.id}`) === "on"]));
        const ingredients = String(formData.get("ingredients") || "")
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
        const macros = {
          calories: Number(formData.get("calories")) || 0,
          protein: Number(formData.get("protein")) || 0,
          carbs: Number(formData.get("carbs")) || 0,
          fat: Number(formData.get("fat")) || 0
        };
        if (state.editingItemId) {
          const item = mockData.menuItems.find((entry) => entry.id === state.editingItemId);
          Object.assign(item, {
            name: formData.get("name"),
            price: Number(formData.get("price")),
            category: formData.get("category"),
            image: formData.get("image"),
            description: formData.get("description"),
            ingredients,
            macros,
            branches: branchMap
          });
        } else {
          mockData.menuItems.unshift({
            id: `menu-${Date.now()}`,
            name: formData.get("name"),
            price: Number(formData.get("price")),
            category: formData.get("category"),
            image: formData.get("image"),
            description: formData.get("description"),
            ingredients,
            macros,
            branches: branchMap,
            halal: true
          });
        }
      }

      if (state.modalType === "promo") {
        mockData.promotions.unshift({
          id: `promo-${Date.now()}`,
          code: String(formData.get("code")).toUpperCase(),
          type: formData.get("type"),
          value: formData.get("value"),
          usage: 0,
          active: true,
          expires: formData.get("expires")
        });
      }

      closeModal();
      render();
    }

    navList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-route]");
      if (!button) return;
      setRoute(button.dataset.route);
    });

    app.addEventListener("click", (event) => {
      const orderButton = event.target.closest("[data-order-id]");
      if (orderButton) {
        openOrderDrawer(orderButton.dataset.orderId);
        return;
      }

      const quickRoute = event.target.closest("[data-quick-route]");
      if (quickRoute) {
        setRoute(quickRoute.dataset.quickRoute);
        return;
      }

      const orderFilter = event.target.closest("[data-order-filter]");
      if (orderFilter) {
        state.orderFilter = orderFilter.dataset.orderFilter;
        state.ordersPage = 1;
        render();
        return;
      }

      const orderPage = event.target.closest("[data-order-page]");
      if (orderPage) {
        state.ordersPage = Math.max(1, state.ordersPage + (orderPage.dataset.orderPage === "next" ? 1 : -1));
        render();
        return;
      }

      const branchToggle = event.target.closest("[data-menu-id][data-branch-id]");
      if (branchToggle) {
        const item = mockData.menuItems.find((entry) => entry.id === branchToggle.dataset.menuId);
        const branchId = branchToggle.dataset.branchId;
        item.branches[branchId] = !item.branches[branchId];
        render();
        return;
      }

      const editMenu = event.target.closest("[data-edit-menu]");
      if (editMenu) {
        openModal("menu", editMenu.dataset.editMenu);
        return;
      }

      const deletePromo = event.target.closest("[data-delete-promo]");
      if (deletePromo) {
        mockData.promotions = mockData.promotions.filter((promo) => promo.id !== deletePromo.dataset.deletePromo);
        render();
        return;
      }

      const customerButton = event.target.closest("[data-customer-id]");
      if (customerButton) {
        state.selectedCustomerId = customerButton.dataset.customerId;
        openCustomerProfileModal(customerButton.dataset.customerId);
        return;
      }

      const openModalButton = event.target.closest("[data-open-modal]");
      if (openModalButton) {
        openModal(openModalButton.dataset.openModal);
      }
    });

    app.addEventListener("change", (event) => {
      const branchStatusButton = event.target.closest("[data-branch-hour]");
      if (branchStatusButton) {
        const branch = getBranchById(branchStatusButton.dataset.branchHour);
        const slot = branch.hours[Number(branchStatusButton.dataset.hourIndex)];
        slot[branchStatusButton.dataset.hourField] = event.target.value;
      }
    });

    app.addEventListener("input", (event) => {
      if (event.target.matches("[data-order-search]")) {
        state.orderSearch = event.target.value;
        state.ordersPage = 1;
        render();
        return;
      }

      if (event.target.matches("[data-menu-search]")) {
        state.menuSearch = event.target.value;
        render();
        return;
      }

      if (event.target.matches("[data-customer-search]")) {
        state.customerSearch = event.target.value;
        render();
      }
    });

    app.addEventListener("click", (event) => {
      const branchStatus = event.target.closest("[data-branch-status]");
      if (branchStatus) {
        const branch = getBranchById(branchStatus.dataset.branchStatus);
        branch.open = !branch.open;
        branch.status = branch.open ? "Open" : "Closed";
        render();
        return;
      }

      const branchDay = event.target.closest("[data-branch-day]");
      if (branchDay) {
        const branch = getBranchById(branchDay.dataset.branchDay);
        const slot = branch.hours[Number(branchDay.dataset.hourIndex)];
        slot.enabled = !slot.enabled;
        render();
      }
    });

    orderDrawer.addEventListener("click", (event) => {
      if (event.target === orderDrawer) closeOrderDrawer();
      const updateButton = event.target.closest("[data-update-order]");
      if (updateButton) {
        updateOrderStatus(updateButton.dataset.updateOrder, updateButton.dataset.nextStatus);
      }
    });

    drawerClose.addEventListener("click", closeOrderDrawer);

    entityModal.addEventListener("click", (event) => {
      if (event.target === entityModal) closeModal();
      if (event.target.closest("[data-close-modal]")) closeModal();
    });
    modalClose.addEventListener("click", closeModal);
    modalForm.addEventListener("submit", handleModalSubmit);

    menuButton.addEventListener("click", () => {
      state.sidebarOpen = !state.sidebarOpen;
      syncSidebar();
    });
    sidebarOverlay.addEventListener("click", () => {
      state.sidebarOpen = false;
      syncSidebar();
    });

    sidebar.addEventListener("click", (event) => {
      const routeButton = event.target.closest("[data-quick-route]");
      if (routeButton) {
        setRoute(routeButton.dataset.quickRoute);
      }
    });

    window.addEventListener("hashchange", () => {
      const hash = window.location.hash.replace("#", "");
      if (routes.some((route) => route.id === hash)) {
        state.route = hash;
        render();
      }
    });

    function init(){
      const initialHash = window.location.hash.replace("#", "");
      if (routes.some((route) => route.id === initialHash)) state.route = initialHash;
      render();
    }

    init();
  </script>
</body>
</html>
